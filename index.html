<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ポチ軍団 | POCHI BOX</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071b35;font-family:system-ui,sans-serif;touch-action:none}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,500px);height:100dvh;max-height:900px;touch-action:none}.hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),476px);display:flex;justify-content:space-between;color:#fff;font-weight:1000;font-size:15px;text-shadow:0 2px 5px #001a}.pill{background:#092b58dd;border:2px solid #ffffff55;border-radius:99px;padding:7px 9px}.tip{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#001a3ddd;color:#fff;padding:10px 17px;border-radius:99px;font-weight:900;pointer-events:none;transition:.3s}.hidden{opacity:0}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#087ddbaa,#04172eee);color:#fff;text-align:center;padding:24px}.card{width:min(90vw,390px);padding:28px 22px;border-radius:30px;background:#092b58;border:3px solid #fff5;box-shadow:0 22px 70px #001a}.card h1{font-size:42px;margin:0;color:#ffd52e;text-shadow:0 4px 0 #c66b00,0 7px 10px #001a}.card p{line-height:1.65;font-weight:700}.card button{border:0;border-radius:18px;padding:16px 28px;font-size:20px;font-weight:1000;background:#ffd52e;color:#092b58;box-shadow:0 6px 0 #c58a00}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill" id="stage">🌳 1-1</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="army">🐾 8</span><span class="pill" id="power">⚡ 1.0</span></div><div class="tip hidden" id="tip">👆 左右にスワイプ！</div><div class="overlay" id="overlay"><div class="card"><h1>ポチ軍団</h1><p>増えるほど火力アップ！<br>敵も波ごとに強くなるぞ。</p><button id="start">🐾 ポチッと出撃！</button></div></div><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),armyEl=document.querySelector('#army'),powerEl=document.querySelector('#power'),stageEl=document.querySelector('#stage'),ov=document.querySelector('#overlay'),tip=document.querySelector('#tip');const STAGES=[{name:'草原',icon:'🌳',sky:['#52bfff','#d9f4ff','#75d17c','#3f9f5a'],boss:'#d83b2e',hp:650,need:42},{name:'砂漠',icon:'🏜️',sky:['#63c8ff','#ffe5a0','#e7b75d','#c88837'],boss:'#9c5b31',hp:1700,need:90},{name:'氷原',icon:'❄️',sky:['#376fc8','#d8f4ff','#a7e9f3','#5eb7d0'],boss:'#7456d8',hp:3600,need:160}];let W,H,dpr,playing=false,last=0,px=.5,army=8,score=0,distance=0,shots=[],enemies=[],gates=[],particles=[],boss=null,pointer=false,gatePair=0,stage=0,wave=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.min(innerWidth,500);H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function reset(){stage=0;army=8;score=0;startStage()}function firePower(){return Math.max(1,Math.pow(army/8,.72))}function fireRate(){return Math.min(28,8+Math.log2(Math.max(1,army/8))*3.2)}function startStage(){playing=true;last=performance.now();px=.5;distance=0;shots=[];enemies=[];gates=[];particles=[];boss=null;gatePair=0;wave=0;ov.style.display='none';stageEl.textContent=STAGES[stage].icon+' '+(stage+1)+'-1';tip.textContent=STAGES[stage].icon+' '+STAGES[stage].name+' / 目標 '+STAGES[stage].need+'体';tip.classList.remove('hidden');setTimeout(()=>tip.classList.add('hidden'),1700);spawnWave();requestAnimationFrame(loop)}
function gateSets(){const n=army;if(n<30)return [[['+',14],['×',2]],[['+',25],['-',4]],[['×',3],['+',30]],[['+',20],['÷',2]]];if(n<100)return [[['+',35],['×',2]],[['×',2],['-',18]],[['+',60],['÷',2]],[['×',3],['-',30]],[['-',12],['+',45]]];if(n<300)return [[['×',2],['+',90]],[['÷',2],['+',120]],[['-',55],['×',2]],[['×',3],['÷',2]],[['+',150],['-',40]]];return [[['×',2],['+',220]],[['÷',2],['+',300]],[['-',120],['×',2]],[['×',3],['÷',3]],[['+',400],['-',90]]]}function applyGate(g){if(g.type==='+')army+=g.n;else if(g.type==='-')army-=g.n;else if(g.type==='×')army*=g.n;else army=Math.floor(army/g.n);army=Math.max(1,army)}
function spawnWave(){wave++;const tier=stage*7+wave;const count=4+stage+Math.min(5,Math.floor(wave/2));const hp=Math.max(2,Math.round(1.5+Math.pow(tier,1.28)*.72));for(let i=0;i<count;i++)enemies.push({x:.14+Math.random()*.72,y:-.1-i*.125,hp,max:hp});const pair=++gatePair,sets=gateSets(),choices=sets[Math.floor(Math.random()*sets.length)];gates.push({x:.25,y:-.58,type:choices[0][0],n:choices[0][1],hit:false,pair},{x:.75,y:-.58,type:choices[1][0],n:choices[1][1],hit:false,pair})}
function input(e){const r=c.getBoundingClientRect();px=Math.max(.1,Math.min(.9,(e.clientX-r.left)/r.width))}c.onpointerdown=e=>{pointer=true;input(e)};c.onpointermove=e=>{if(pointer)input(e)};onpointerup=()=>pointer=false;document.querySelector('#start').onclick=reset;function loop(t){if(!playing)return;const dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){distance+=dt;if(Math.random()<dt*fireRate())shots.push({x:px,y:.72,p:firePower()});shots.forEach(s=>s.y-=dt*1.35);shots=shots.filter(s=>s.y>-.1);enemies.forEach(e=>e.y+=dt*(.19+stage*.01+wave*.0015));gates.forEach(g=>g.y+=dt*.2);for(const s of shots)for(const e of enemies)if(e.hp>0&&s.p>0&&Math.abs(s.x-e.x)<.058&&Math.abs(s.y-e.y)<.058){e.hp-=s.p;s.p=0;if(e.hp<=0){score+=Math.round(25+e.max*8);burst(e.x,e.y,'#ffd52e')}}for(const e of enemies)if(e.hp>0&&e.y>=.76){finish(false,'敵が突破した！ 強化が足りない！');return}enemies=enemies.filter(e=>e.hp>0&&e.y<1.1);for(const g of gates)if(!g.hit&&g.y>.72&&g.y<.84&&Math.abs(px-g.x)<.17){applyGate(g);burst(g.x,g.y,(g.type==='-'||g.type==='÷')?'#ff4b55':g.type==='+'?'#32c8ff':'#ffb21a');for(const o of gates)if(o.pair===g.pair)o.hit=true;break}gates=gates.filter(g=>!g.hit&&g.y<1.1);particles.forEach(p=>{p.y+=p.vy*dt;p.x+=p.vx*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);const run=24+stage*3;if(distance>run&&!boss){if(army<STAGES[stage].need){finish(false,'戦力不足！ '+STAGES[stage].need+'体必要');return}boss={x:.5,y:-.2,hp:STAGES[stage].hp,max:STAGES[stage].hp}}if(boss){boss.y=Math.min(.18,boss.y+dt*.12);for(const s of shots)if(s.p>0&&Math.abs(s.x-boss.x)<.18&&Math.abs(s.y-boss.y)<.13){boss.hp-=s.p;s.p=0}if(boss.hp<=0){score+=1000*(stage+1)+army*8;completeStage()}}else if(enemies.length===0&&gates.length===0&&distance<run-1)spawnWave();if(distance>run+14&&boss)finish(false,'ボスを倒しきれなかった！');scoreEl.textContent='⭐ '+Math.floor(score);armyEl.textContent='🐾 '+army.toLocaleString();powerEl.textContent='⚡ '+firePower().toFixed(1)}
function completeStage(){playing=false;if(stage<STAGES.length-1){const done=STAGES[stage];stage++;ov.style.display='grid';ov.innerHTML=`<div class="card"><h1>${done.icon} 突破！</h1><p>🐾 ${army.toLocaleString()}体<br>⚡ 火力 ${firePower().toFixed(1)}倍<br>${STAGES[stage].icon} ${STAGES[stage].name}へ！</p><button onclick="startStage()">次のステージへ！</button></div>`}else finish(true,'3ステージ完全制覇！')}function burst(a,b,color){for(let i=0;i<7;i++)particles.push({x:a,y:b,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,life:.5,color})}function finish(win,reason=''){playing=false;ov.style.display='grid';ov.innerHTML=`<div class="card"><h1>${win?'完全制覇！':'GAME OVER'}</h1><p>${reason}<br>⭐ <b>${Math.floor(score)}</b><br>🐾 <b>${army.toLocaleString()}</b>体 / ⚡ <b>${firePower().toFixed(1)}</b>倍</p><button onclick="reset()">最初から挑戦！</button></div>`}function rr(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=3;x.stroke()}}
function pochi(a,b,color='#2e8cff',scale=1,evil=false){x.save();x.translate(a,b);x.scale(scale,scale);x.fillStyle='#f8e9d1';x.beginPath();x.ellipse(0,1,11,13,0,0,7);x.fill();x.fillStyle=color;x.beginPath();x.arc(0,-8,10,Math.PI,0);x.lineTo(10,-4);x.lineTo(-10,-4);x.fill();x.fillStyle='#fff';x.fillRect(-8,-6,16,3);x.fillStyle='#15202b';x.beginPath();x.arc(-4,0,1.8,0,7);x.arc(4,0,1.8,0,7);x.fill();x.fillStyle=color;x.fillRect(-9,9,7,8);x.fillRect(2,9,7,8);x.restore()}function monster(a,b,s=1){x.save();x.translate(a,b);x.scale(s,s);x.fillStyle=STAGES[stage].boss;x.beginPath();x.arc(0,0,38,0,7);x.fill();x.fillStyle='#f1c28e';x.beginPath();x.moveTo(-26,-27);x.lineTo(-36,-50);x.lineTo(-12,-33);x.moveTo(26,-27);x.lineTo(36,-50);x.lineTo(12,-33);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(-13,-8,9,7,0,0,7);x.ellipse(13,-8,9,7,0,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-10,-7,3,0,7);x.arc(10,-7,3,0,7);x.fill();x.restore()}
function draw(){const st=STAGES[stage],sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,st.sky[0]);sky.addColorStop(.48,st.sky[1]);sky.addColorStop(.49,st.sky[2]);sky.addColorStop(1,st.sky[3]);x.fillStyle=sky;x.fillRect(0,0,W,H);const road=x.createLinearGradient(0,0,W,0);road.addColorStop(0,'#7e8791');road.addColorStop(.5,stage===1?'#d8b16f':stage===2?'#d9f3f8':'#c9d1d7');road.addColorStop(1,'#7e8791');x.fillStyle=road;x.beginPath();x.moveTo(W*.06,H);x.lineTo(W*.3,0);x.lineTo(W*.7,0);x.lineTo(W*.94,H);x.fill();for(const g of gates){const gx=g.x*W,gy=g.y*H,bad=g.type==='-'||g.type==='÷',col=bad?'#ff4b55':g.type==='+'?'#0ab8ff':'#ffb000';x.shadowColor=col;x.shadowBlur=18;rr(gx-W*.155,gy-H*.055,W*.31,H*.11,10,col+'dd','#fff');x.shadowBlur=0;x.fillStyle='#fff';x.font='1000 29px system-ui';x.textAlign='center';x.fillText(g.type+g.n,gx,gy+9)}for(const e of enemies){pochi(e.x*W,e.y*H,stage===2?'#755be0':stage===1?'#b45d32':'#e83d35',.9,true);if(e.max>5){rr(e.x*W-14,e.y*H-25,28,4,2,'#301');rr(e.x*W-14,e.y*H-25,28*Math.max(0,e.hp/e.max),4,2,'#ff4b55')}}if(boss){monster(boss.x*W,boss.y*H,1.25);rr(W*.2,H*.09,W*.6,18,9,'#14233b','#fff');rr(W*.205,H*.095,W*.59*Math.max(0,boss.hp/boss.max),8,4,'#ff3b30')}for(const s of shots){x.fillStyle='#bff5ff';x.beginPath();x.ellipse(s.x*W,s.y*H,Math.min(7,3+firePower()*.12),13,0,0,7);x.fill()}const shown=Math.min(army,42);for(let i=shown-1;i>=0;i--){const row=Math.floor(i/7),col=i%7,n=Math.min(7,shown-row*7),colors=['#2588ff','#2588ff','#ffd22e','#2588ff','#42a84d','#e83d35'];pochi((px+(col-(n-1)/2)*.041)*W,(.78+row*.034)*H,colors[i%colors.length],.72)}for(const p of particles){x.fillStyle=p.color;x.beginPath();x.arc(p.x*W,p.y*H,4,0,7);x.fill()}}draw();</script></body></html>
