<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ポチ軍団 | POCHI BOX</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101827;font-family:system-ui,sans-serif;touch-action:none}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,500px);height:100dvh;max-height:900px;background:#bde7ff;touch-action:none}.hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),476px);display:flex;justify-content:space-between;color:#fff;font-weight:900;text-shadow:0 2px 4px #0008;pointer-events:none}.tip{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0009;color:#fff;padding:10px 16px;border-radius:99px;font-weight:800;pointer-events:none;transition:.3s}.hidden{opacity:0}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#07111cbb;color:#fff;text-align:center;padding:24px}.card{width:min(90vw,390px);padding:28px 22px;border-radius:28px;background:#17263b;border:2px solid #ffffff26;box-shadow:0 20px 60px #0008}.card h1{font-size:40px;margin:0 0 8px}.card p{line-height:1.6}.card button{border:0;border-radius:18px;padding:16px 28px;font-size:20px;font-weight:900;background:#ffd43b;color:#182033;box-shadow:0 6px 0 #c69c00}.card button:active{transform:translateY(4px);box-shadow:0 2px 0 #c69c00}
</style></head><body>
<canvas id="game"></canvas><div class="hud"><span id="score">SCORE 0</span><span id="army">👥 5</span></div><div class="tip hidden" id="tip">左右にスワイプ！</div><div class="overlay" id="overlay"><div class="card"><h1>ポチ軍団</h1><p>左右に動いてゲートを選べ！<br>仲間を増やして巨大ボスを倒そう。</p><button id="start">ポチッと出撃！</button></div></div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),armyEl=document.querySelector('#army'),ov=document.querySelector('#overlay'),tip=document.querySelector('#tip');let W,H,dpr,playing=false,last=0,px=.5,army=5,score=0,distance=0,shots=[],enemies=[],gates=[],particles=[],boss=null,pointer=false,gatePair=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.min(innerWidth,500);H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){playing=true;last=performance.now();px=.5;army=5;score=0;distance=0;shots=[];enemies=[];gates=[];particles=[];boss=null;gatePair=0;ov.style.display='none';tip.classList.remove('hidden');setTimeout(()=>tip.classList.add('hidden'),1800);spawnWave();requestAnimationFrame(loop)}
function spawnWave(){for(let i=0;i<5;i++)enemies.push({x:.15+Math.random()*.7,y:-.1-i*.16,hp:2});const pair=++gatePair;const choices=Math.random()<.5?[['+',8],['×',2]]:[['+',15],['+',5]];gates.push({x:.25,y:-.55,type:choices[0][0],n:choices[0][1],hit:false,pair},{x:.75,y:-.55,type:choices[1][0],n:choices[1][1],hit:false,pair})}
function input(e){const r=c.getBoundingClientRect();px=Math.max(.09,Math.min(.91,(e.clientX-r.left)/r.width))}c.onpointerdown=e=>{pointer=true;input(e)};c.onpointermove=e=>{if(pointer)input(e)};onpointerup=()=>pointer=false;document.querySelector('#start').onclick=reset;
function loop(t){if(!playing)return;const dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){distance+=dt;score+=dt*12;if(Math.random()<dt*8)shots.push({x:px,y:.73});shots.forEach(s=>s.y-=dt*1.25);shots=shots.filter(s=>s.y>-0.1);enemies.forEach(e=>e.y+=dt*.22);gates.forEach(g=>g.y+=dt*.22);for(const s of shots)for(const e of enemies)if(Math.abs(s.x-e.x)<.05&&Math.abs(s.y-e.y)<.05){e.hp--;s.y=-1;if(e.hp<=0){score+=25;burst(e.x,e.y)}}enemies=enemies.filter(e=>e.hp>0&&e.y<1.1);for(const g of gates){if(!g.hit&&g.y>.72&&g.y<.84&&Math.abs(px-g.x)<.17){g.hit=true;army=g.type==='+'?army+g.n:army*g.n;army=Math.min(99,army);score+=army*3;burst(g.x,g.y);for(const other of gates)if(other.pair===g.pair&&other!==g)other.hit=true;break}}gates=gates.filter(g=>!g.hit&&g.y<1.1);particles.forEach(p=>{p.y+=p.vy*dt;p.x+=p.vx*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(distance>13&&!boss)boss={x:.5,y:-.2,hp:150,max:150};if(boss){boss.y=Math.min(.18,boss.y+dt*.12);for(const s of shots)if(Math.abs(s.x-boss.x)<.18&&Math.abs(s.y-boss.y)<.12){boss.hp-=Math.max(1,army*.035);s.y=-1}if(boss.hp<=0){score+=1000+army*20;finish(true)}}else if(enemies.length===0&&gates.length===0&&distance<12)spawnWave();if(distance>23&&boss)finish(false);scoreEl.textContent='SCORE '+Math.floor(score);armyEl.textContent='👥 '+army}
function burst(a,b){for(let i=0;i<8;i++)particles.push({x:a,y:b,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,life:.5})}
function finish(win){playing=false;ov.style.display='grid';ov.innerHTML=`<div class="card"><h1>${win?'撃破！':'時間切れ！'}</h1><p>スコア <b>${Math.floor(score)}</b><br>仲間 <b>${army}人</b></p><button onclick="reset()">もう一回！</button></div>`}
function draw(){x.clearRect(0,0,W,H);x.fillStyle='#88c97b';x.fillRect(0,0,W,H);x.fillStyle='#66727c';x.beginPath();x.moveTo(W*.08,H);x.lineTo(W*.27,0);x.lineTo(W*.73,0);x.lineTo(W*.92,H);x.fill();x.strokeStyle='#ffffff44';x.lineWidth=3;x.setLineDash([24,24]);x.beginPath();x.moveTo(W*.5,H);x.lineTo(W*.5,0);x.stroke();x.setLineDash([]);for(const g of gates){const gx=g.x*W,gy=g.y*H;x.fillStyle=g.type==='+'?'#36c5f0':'#ff70b7';x.globalAlpha=.78;x.fillRect(gx-W*.16,gy-H*.055,W*.32,H*.11);x.globalAlpha=1;x.fillStyle='#fff';x.font='900 28px system-ui';x.textAlign='center';x.fillText(g.type+g.n,gx,gy+9)}for(const e of enemies)person(e.x*W,e.y*H,'#e74c3c');if(boss){x.fillStyle='#9b3f35';x.beginPath();x.arc(boss.x*W,boss.y*H,W*.14,0,7);x.fill();x.fillStyle='#222';x.fillRect(W*.25,H*.035,W*.5,14);x.fillStyle='#ff3b30';x.fillRect(W*.25,H*.035,W*.5*Math.max(0,boss.hp/boss.max),14);x.fillStyle='#fff';x.font='900 16px system-ui';x.fillText('BOSS',W*.5,H*.03)}for(const s of shots){x.fillStyle='#ffe66d';x.fillRect(s.x*W-3,s.y*H-14,6,18)}const shown=Math.min(army,30);for(let i=0;i<shown;i++){const row=Math.floor(i/6),col=i%6,n=Math.min(6,shown-row*6);person((px+(col-(n-1)/2)*.045)*W,(.82+row*.035)*H,'#3185fc')}for(const p of particles){x.fillStyle='#ffd43b';x.fillRect(p.x*W,p.y*H,5,5)}}
function person(a,b,color){x.fillStyle=color;x.beginPath();x.arc(a,b-7,6,0,7);x.fill();x.fillRect(a-6,b-1,12,13)}
draw();
</script></body></html>
