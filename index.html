<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ポチ軍団 | POCHI BOX</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071b35;font-family:system-ui,sans-serif;touch-action:none}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,500px);height:100dvh;max-height:900px;touch-action:none}.hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(calc(100% - 24px),476px);display:flex;justify-content:space-between;color:#fff;font-weight:1000;font-size:18px;text-shadow:0 2px 5px #001a}.pill{background:#092b58dd;border:2px solid #ffffff55;border-radius:99px;padding:7px 13px}.tip{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#001a3ddd;color:#fff;padding:10px 17px;border-radius:99px;font-weight:900;pointer-events:none;transition:.3s}.hidden{opacity:0}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#087ddbaa,#04172eee);color:#fff;text-align:center;padding:24px}.card{width:min(90vw,390px);padding:28px 22px;border-radius:30px;background:#092b58;border:3px solid #fff5;box-shadow:0 22px 70px #001a}.card h1{font-size:44px;margin:0;color:#ffd52e;text-shadow:0 4px 0 #c66b00,0 7px 10px #001a}.card p{line-height:1.65;font-weight:700}.card button{border:0;border-radius:18px;padding:16px 28px;font-size:20px;font-weight:1000;background:#ffd52e;color:#092b58;box-shadow:0 6px 0 #c58a00}.card button:active{transform:translateY(4px);box-shadow:0 2px 0 #c58a00}</style></head><body><canvas id="game"></canvas><div class="hud"><span class="pill" id="score">⭐ 0</span><span class="pill" id="army">🐾 5</span></div><div class="tip hidden" id="tip">👆 左右にスワイプ！</div><div class="overlay" id="overlay"><div class="card"><h1>ポチ軍団</h1><p>集めて！増やして！ぶっ飛ばせ！<br>ゲートを選んで巨大ボスに挑め。</p><button id="start">🐾 ポチッと出撃！</button></div></div><script>
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),armyEl=document.querySelector('#army'),ov=document.querySelector('#overlay'),tip=document.querySelector('#tip');let W,H,dpr,playing=false,last=0,px=.5,army=5,score=0,distance=0,shots=[],enemies=[],gates=[],particles=[],boss=null,pointer=false,gatePair=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.min(innerWidth,500);H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){playing=true;last=performance.now();px=.5;army=5;score=0;distance=0;shots=[];enemies=[];gates=[];particles=[];boss=null;gatePair=0;ov.style.display='none';tip.classList.remove('hidden');setTimeout(()=>tip.classList.add('hidden'),1800);spawnWave();requestAnimationFrame(loop)}
function spawnWave(){for(let i=0;i<5;i++)enemies.push({x:.15+Math.random()*.7,y:-.1-i*.16,hp:2});const pair=++gatePair,choices=Math.random()<.5?[['+',10],['×',2]]:[['+',16],['+',7]];gates.push({x:.25,y:-.55,type:choices[0][0],n:choices[0][1],hit:false,pair},{x:.75,y:-.55,type:choices[1][0],n:choices[1][1],hit:false,pair})}
function input(e){const r=c.getBoundingClientRect();px=Math.max(.1,Math.min(.9,(e.clientX-r.left)/r.width))}c.onpointerdown=e=>{pointer=true;input(e)};c.onpointermove=e=>{if(pointer)input(e)};onpointerup=()=>pointer=false;document.querySelector('#start').onclick=reset;
function loop(t){if(!playing)return;const dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(loop)}
function update(dt){distance+=dt;score+=dt*12;if(Math.random()<dt*10)shots.push({x:px,y:.72});shots.forEach(s=>s.y-=dt*1.3);shots=shots.filter(s=>s.y>-.1);enemies.forEach(e=>e.y+=dt*.22);gates.forEach(g=>g.y+=dt*.22);for(const s of shots)for(const e of enemies)if(Math.abs(s.x-e.x)<.05&&Math.abs(s.y-e.y)<.05){e.hp--;s.y=-1;if(e.hp<=0){score+=25;burst(e.x,e.y,'#ffd52e')}}enemies=enemies.filter(e=>e.hp>0&&e.y<1.1);for(const g of gates)if(!g.hit&&g.y>.72&&g.y<.84&&Math.abs(px-g.x)<.17){g.hit=true;army=g.type==='+'?army+g.n:army*g.n;army=Math.min(99,army);score+=army*3;burst(g.x,g.y,g.type==='+'?'#32c8ff':'#ffb21a');for(const o of gates)if(o.pair===g.pair)o.hit=true;break}gates=gates.filter(g=>!g.hit&&g.y<1.1);particles.forEach(p=>{p.y+=p.vy*dt;p.x+=p.vx*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);if(distance>24&&!boss)boss={x:.5,y:-.2,hp:110,max:110};if(boss){boss.y=Math.min(.18,boss.y+dt*.12);for(const s of shots)if(Math.abs(s.x-boss.x)<.18&&Math.abs(s.y-boss.y)<.13){boss.hp-=Math.max(1.4,army*.055);s.y=-1;burst(s.x,s.y,'#ff9d00')}if(boss.hp<=0){score+=1000+army*20;finish(true)}}else if(enemies.length===0&&gates.length===0&&distance<23)spawnWave();if(distance>37&&boss)finish(false);scoreEl.textContent='⭐ '+Math.floor(score);armyEl.textContent='🐾 '+army}
function burst(a,b,color){for(let i=0;i<7;i++)particles.push({x:a,y:b,vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,life:.5,color})}
function finish(win){playing=false;ov.style.display='grid';ov.innerHTML=`<div class="card"><h1>${win?'ボス撃破！':'あと少し！'}</h1><p>⭐ スコア <b>${Math.floor(score)}</b><br>🐾 ポチ隊員 <b>${army}</b></p><button onclick="reset()">もう一回！</button></div>`}
function rr(a,b,w,h,r,fill,stroke){x.beginPath();x.roundRect(a,b,w,h,r);x.fillStyle=fill;x.fill();if(stroke){x.strokeStyle=stroke;x.lineWidth=3;x.stroke()}}
function pochi(a,b,color='#2e8cff',scale=1,evil=false){x.save();x.translate(a,b);x.scale(scale,scale);x.fillStyle='#001a';x.globalAlpha=.18;x.beginPath();x.ellipse(1,15,12,5,0,0,7);x.fill();x.globalAlpha=1;x.fillStyle='#f8e9d1';x.beginPath();x.ellipse(0,1,11,13,0,0,7);x.fill();x.fillStyle=color;x.beginPath();x.arc(0,-8,10,Math.PI,0);x.lineTo(10,-4);x.lineTo(-10,-4);x.fill();x.fillStyle='#fff';x.fillRect(-8,-6,16,3);x.fillStyle='#15202b';x.beginPath();x.arc(-4,0,1.8,0,7);x.arc(4,0,1.8,0,7);x.fill();x.strokeStyle=evil?'#8b1b16':'#e04c4c';x.lineWidth=1.5;x.beginPath();evil?(x.moveTo(-4,6),x.lineTo(4,3)):(x.arc(0,4,3,0,Math.PI));x.stroke();x.fillStyle=color;x.fillRect(-9,9,7,8);x.fillRect(2,9,7,8);x.restore()}
function monster(a,b,s=1){x.save();x.translate(a,b);x.scale(s,s);x.fillStyle='#001a';x.globalAlpha=.2;x.beginPath();x.ellipse(0,38,43,12,0,0,7);x.fill();x.globalAlpha=1;x.fillStyle='#d83b2e';x.beginPath();x.arc(0,0,38,0,7);x.fill();x.fillStyle='#f1c28e';x.beginPath();x.moveTo(-26,-27);x.lineTo(-36,-50);x.lineTo(-12,-33);x.moveTo(26,-27);x.lineTo(36,-50);x.lineTo(12,-33);x.fill();x.fillStyle='#fff';x.beginPath();x.ellipse(-13,-8,9,7,0,0,7);x.ellipse(13,-8,9,7,0,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(-10,-7,3,0,7);x.arc(10,-7,3,0,7);x.fill();x.fillStyle='#61130f';x.beginPath();x.roundRect(-20,8,40,22,10);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(-13,9);x.lineTo(-7,19);x.lineTo(-2,9);x.moveTo(13,9);x.lineTo(7,19);x.lineTo(2,9);x.fill();x.restore()}
function draw(){const sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#52bfff');sky.addColorStop(.48,'#d9f4ff');sky.addColorStop(.49,'#75d17c');sky.addColorStop(1,'#3f9f5a');x.fillStyle=sky;x.fillRect(0,0,W,H);for(let i=0;i<7;i++){x.fillStyle=i%2?'#76b45a':'#5ba64e';x.beginPath();x.arc((i*.19+.05)*W,H*.36,35+i%3*8,0,7);x.fill()}const road=x.createLinearGradient(0,0,W,0);road.addColorStop(0,'#7e8791');road.addColorStop(.5,'#c9d1d7');road.addColorStop(1,'#7e8791');x.fillStyle=road;x.beginPath();x.moveTo(W*.06,H);x.lineTo(W*.3,0);x.lineTo(W*.7,0);x.lineTo(W*.94,H);x.fill();x.strokeStyle='#fff8';x.lineWidth=4;x.setLineDash([30,30]);x.beginPath();x.moveTo(W*.5,H);x.lineTo(W*.5,0);x.stroke();x.setLineDash([]);for(const g of gates){const gx=g.x*W,gy=g.y*H,col=g.type==='+'?'#0ab8ff':'#ffb000';x.shadowColor=col;x.shadowBlur=18;rr(gx-W*.155,gy-H*.052,W*.31,H*.105,10,col+'cc','#fff');x.shadowBlur=0;x.fillStyle='#fff';x.font='1000 30px system-ui';x.textAlign='center';x.fillText(g.type+g.n,gx,gy+10)}for(const e of enemies)pochi(e.x*W,e.y*H,'#e83d35',.9,true);if(boss){monster(boss.x*W,boss.y*H,1.25);rr(W*.2,H*.035,W*.6,18,9,'#14233b','#fff');rr(W*.205,H*.04,W*.59*Math.max(0,boss.hp/boss.max),8,4,'#ff3b30');x.fillStyle='#fff';x.font='1000 15px system-ui';x.fillText('👹 BOSS',W*.5,H*.085)}for(const s of shots){x.shadowColor='#20caff';x.shadowBlur=12;x.fillStyle='#bff5ff';x.beginPath();x.ellipse(s.x*W,s.y*H,4,13,0,0,7);x.fill();x.shadowBlur=0}const shown=Math.min(army,30);for(let i=shown-1;i>=0;i--){const row=Math.floor(i/6),col=i%6,n=Math.min(6,shown-row*6),colors=['#2588ff','#2588ff','#ffd22e','#2588ff','#42a84d','#e83d35'];pochi((px+(col-(n-1)/2)*.047)*W,(.79+row*.038)*H,colors[i%colors.length],.78)}for(const p of particles){x.fillStyle=p.color;x.beginPath();x.arc(p.x*W,p.y*H,4,0,7);x.fill()}}
draw();</script></body></html>
